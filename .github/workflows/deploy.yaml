name: Deploy Lambda Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy createOrder
        run: |
          cd lambdas

          zip -r createOrder.zip cmtr_9muunkkm_lambda_createOrder

          echo "=== ZIP CONTENT ==="
          unzip -l createOrder.zip

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_createOrder \
            --zip-file fileb://createOrder.zip

      - name: Deploy createOrder
        run: |
          cd lambdas
          zip -r /tmp/createOrder.zip cmtr_9muunkkm_lambda_createOrder

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_createOrder \
            --zip-file fileb:///tmp/createOrder.zip

      - name: Deploy reserveStock
        run: |
          cd lambdas
          zip -r /tmp/reserveStock.zip cmtr_9muunkkm_lambda_reserveStock

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_reserveStock \
            --zip-file fileb:///tmp/reserveStock.zip

      - name: Deploy sendNotification
        run: |
          cd lambdas
          zip -r /tmp/sendNotification.zip cmtr_9muunkkm_lambda_sendNotification

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_sendNotification \
            --zip-file fileb:///tmp/sendNotification.zip
