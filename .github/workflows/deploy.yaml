name: Deploy Lambda Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy createOrder
        run: |
          cd lambdas/cmtr_9muunkkm_lambda_createOrder
          zip -j function.zip handler.py

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_createOrder \
            --zip-file fileb://function.zip

      - name: Deploy reserveStock
        run: |
          cd lambdas/cmtr_9muunkkm_lambda_reserveStock
          zip -j function.zip handler.py

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_reserveStock \
            --zip-file fileb://function.zip

      - name: Deploy sendNotification
        run: |
          cd lambdas/cmtr_9muunkkm_lambda_sendNotification
          zip -j function.zip handler.py

          aws lambda update-function-code \
            --function-name cmtr_9muunkkm_lambda_sendNotification \
            --zip-file fileb://function.zip
